name: Build Native Payload

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip cpp folder
      run: |
        unzip cpp.zip -d .
        rm cpp.zip

    - name: Auto-Patch payload.cpp Fixes
      run: |
        # تصحيح أنواع البيانات
        sed -i 's/typedef fopen_t (\*fopen_t)/typedef FILE* (*fopen_t)/g' cpp/payload.cpp
        sed -i 's/typedef read_t (\*read_t)/typedef ssize_t (*read_t)/g' cpp/payload.cpp
        # تصحيح متغير القائمة
        sed -i 's/static std::atomic<bool> g_menu_open{true};/static bool g_menu_open = true;/g' cpp/payload.cpp
        sed -i 's/g_menu_open.load()/g_menu_open/g' cpp/payload.cpp

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b

    - name: Configure CMake
      run: |
        cd cpp
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd cpp
        cmake --build build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libmenu
        path: cpp/build/libmenu.so
