name: Build Native Payload and Injector

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b

    - name: Configure CMake
      run: |
        cd cpp
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Payload (.so)
      run: |
        cd cpp
        cmake --build build

    - name: Build Injector Executable
      run: |
        ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++ -static -O2 injector.cpp -o injector

    - name: Upload All Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-Complete
        path: |
          cpp/build/libmenu.so
          injector
