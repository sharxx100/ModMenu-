name: Build Native Payload

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip cpp folder
      run: |
        unzip cpp.zip -d extracted_cpp
        rm cpp.zip

    - name: Auto-Patch payload.cpp Fixes
      run: |
        FILE=$(find extracted_cpp -name "payload.cpp" | head -n 1)
        if [ -n "$FILE" ]; then
          sed -i 's/typedef fopen_t (\*fopen_t)/typedef FILE* (*fopen_t)/g' "$FILE"
          sed -i 's/typedef read_t (\*read_t)/typedef ssize_t (*read_t)/g' "$FILE"
          sed -i 's/static std::atomic<bool> g_menu_open{true};/static bool g_menu_open = true;/g' "$FILE"
          sed -i 's/g_menu_open.load()/g_menu_open/g' "$FILE"
        fi

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b

    - name: Configure CMake
      run: |
        CMAKE_DIR=$(find extracted_cpp -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
        cd "$CMAKE_DIR"
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        CMAKE_DIR=$(find extracted_cpp -name "CMakeLists.txt" -exec dirname {} \; | head -n 1)
        cd "$CMAKE_DIR"
        cmake --build build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libmenu
        path: "**/libmenu.so"
